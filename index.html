<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="เว็บต้นแบบระบบแจ้งและติดตามปัญหาขยะล้นภายในมหาวิทยาลัย">
<title>Smart Waste</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: deep-teal app bar, role switch, scrollable tab strip, one working column that widens to two columns on desktop */
:root{
  --bg:#f1f5f4; --surface:#ffffff; --surface2:#e8f1ef; --ink:#0f2a30; --muted:#587076; --line:#d6e2df;
  --deep:#0d2b33; --deep-ink:#e7f3f1;
  --teal:#0e8a84; --teal-ink:#0a6b66; --teal-soft:#dcefec; --on-teal:#ffffff;
  --red:#d6403b; --red-ink:#a3231f; --red-soft:#fde5e3;
  --amber:#e39a12; --amber-ink:#8a5a00; --amber-soft:#fcefd0;
  --green:#2f9e5a; --green-ink:#1c7040; --green-soft:#dbf1e2;
  --bin-general:#2f6bb5; --bin-recycle:#e9b824; --bin-organic:#2f9e5a; --bin-hazard:#d6403b;
  --line-green:#06b05a;
  --font:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(13,43,51,.06),0 6px 18px rgba(13,43,51,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a171b; --surface:#11252a; --surface2:#16303a; --ink:#e6f1f0; --muted:#93acb1; --line:#244047;
  --deep:#071a1f; --deep-ink:#e7f3f1;
  --teal:#2db3ab; --teal-ink:#6fd6cf; --teal-soft:#14383b; --on-teal:#06201f;
  --red:#ef6a65; --red-ink:#ff9a96; --red-soft:#3a1a1b;
  --amber:#f0b03a; --amber-ink:#f5c969; --amber-soft:#382a0c;
  --green:#4cc17c; --green-ink:#7fdba2; --green-soft:#12301f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a171b; --surface:#11252a; --surface2:#16303a; --ink:#e6f1f0; --muted:#93acb1; --line:#244047;
  --deep:#071a1f; --deep-ink:#e7f3f1;
  --teal:#2db3ab; --teal-ink:#6fd6cf; --teal-soft:#14383b; --on-teal:#06201f;
  --red:#ef6a65; --red-ink:#ff9a96; --red-soft:#3a1a1b;
  --amber:#f0b03a; --amber-ink:#f5c969; --amber-soft:#382a0c;
  --green:#4cc17c; --green-ink:#7fdba2; --green-soft:#12301f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0;text-wrap:balance}
.wrap{width:100%;max-width:1080px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* app bar */
.bar{background:var(--deep);color:var(--deep-ink)}
.bar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:15px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--teal);display:grid;place-items:center;color:var(--on-teal)}
.bar .sub{font-size:12px;opacity:.7;flex:1 1 220px;min-width:0}
.roles{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;gap:2px}
.roles button{background:none;border:0;color:inherit;padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
.roles button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal);font-weight:600}
.tools{display:flex;gap:8px;align-items:center}
.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:inherit;border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer}
.ghost:hover{background:rgba(255,255,255,.16)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px 10px;cursor:pointer;color:var(--muted);
  display:flex;align-items:center;gap:7px;font-size:14px;white-space:nowrap}
.tabs button svg{width:18px;height:18px}
.tabs button[aria-current="page"]{color:var(--teal-ink);border-bottom-color:var(--teal);font-weight:600}
.tabs .badge{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px}

main.wrap{padding-block:22px 56px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:grid;gap:16px;min-width:0}
@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.h{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:10px}
.title{font-size:20px;font-weight:700;line-height:1.3}
.muted{color:var(--muted)}
.small{font-size:13px}

.hero{background:var(--deep);color:var(--deep-ink);border:0;overflow:hidden;position:relative}
.hero .big{font-size:clamp(26px,5vw,38px);font-weight:700;line-height:1.2;margin:6px 0 8px}
.hero .big em{font-style:normal;color:var(--teal-ink);color:#7fe0d8}
.hero p{opacity:.8;max-width:46ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;padding:11px 18px;cursor:pointer;font-weight:600;min-height:44px}
.btn.primary{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.dark{background:var(--deep);color:var(--deep-ink);border-color:var(--deep)}
.btn.lg{font-size:17px;padding:15px 22px;width:100%}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{min-height:36px;padding:7px 13px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:is(button,input,select,textarea,a):focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--teal-soft);color:var(--teal-ink);border:0;border-radius:12px;padding:14px;cursor:pointer;font-weight:600}
.tile svg{width:22px;height:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.kpi{background:var(--surface2);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:24px;line-height:1.15}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.red{background:var(--red-soft);color:var(--red-ink)} .kpi.amber{background:var(--amber-soft);color:var(--amber-ink)} .kpi.green{background:var(--green-soft);color:var(--green-ink)}
.kpi.red span,.kpi.amber span,.kpi.green span{color:inherit;opacity:.85}

/* status */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.wait{background:var(--red-soft);color:var(--red-ink)}
.pill.doing{background:var(--amber-soft);color:var(--amber-ink)}
.pill.done{background:var(--green-soft);color:var(--green-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;cursor:pointer;font-size:14px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--deep);color:var(--deep-ink);border-color:var(--deep)}
.chip.sel[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}

/* report cards */
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;width:100%;cursor:pointer}
.item:hover{border-color:var(--teal)}
.thumb{width:52px;height:52px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.item .id{font-family:var(--mono);font-size:13px;font-weight:500}
.item .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.dot.general{background:var(--bin-general)} .dot.recycle{background:var(--bin-recycle)} .dot.organic{background:var(--bin-organic)} .dot.hazard{background:var(--bin-hazard)}
.timer{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;border-radius:8px;padding:3px 9px;background:var(--amber-soft);color:var(--amber-ink)}
.timer.late{background:var(--red-soft);color:var(--red-ink)}
.timer.esc{background:var(--red);color:#fff}

.job{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;border-left:5px solid var(--red)}
.job.doing{border-left-color:var(--amber)} .job.done{border-left-color:var(--green)}
.job .top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}

/* forms */
.field{display:grid;gap:6px;margin-bottom:16px}
.field>label,.field>.lab{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;min-height:44px}
textarea.input{min-height:84px;resize:vertical}
.autofill{background:var(--teal-soft);border-radius:12px;padding:12px 14px;color:var(--teal-ink)}
.autofill small{display:block;font-weight:500;opacity:.85}
.autofill b{font-size:15px}
.photo{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.photo .pv{width:76px;height:76px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.photo .pv img{width:100%;height:100%;object-fit:cover}
.drop{flex:1 1 180px;border:2px dashed var(--teal);border-radius:12px;padding:12px;display:grid;place-items:center;text-align:center;color:var(--teal-ink);cursor:pointer;font-weight:600;min-height:76px}
.err{color:var(--red-ink);font-size:13px;font-weight:600;min-height:20px}
.gps{display:flex;gap:8px;align-items:center;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 6px;cursor:pointer;font-weight:600;min-height:44px}
.seg button[aria-pressed="true"].s-wait{background:var(--red);border-color:var(--red);color:#fff}
.seg button[aria-pressed="true"].s-doing{background:var(--amber);border-color:var(--amber);color:#2a1d00}
.seg button[aria-pressed="true"].s-done{background:var(--green);border-color:var(--green);color:#fff}

/* scan */
.cam{background:#06151a;border-radius:16px;aspect-ratio:1/1;max-width:380px;width:100%;margin:0 auto;display:grid;place-items:center;position:relative;overflow:hidden;color:#cfe6e3}
.cam .frame{width:62%;aspect-ratio:1;position:relative}
.cam .frame::before,.cam .frame::after{content:"";position:absolute;inset:0;border:3px solid #2ee0d4;border-radius:14px;
  -webkit-mask:linear-gradient(#000 0 0) top left/26px 26px no-repeat,linear-gradient(#000 0 0) top right/26px 26px no-repeat,linear-gradient(#000 0 0) bottom left/26px 26px no-repeat,linear-gradient(#000 0 0) bottom right/26px 26px no-repeat;
  mask:linear-gradient(#000 0 0) top left/26px 26px no-repeat,linear-gradient(#000 0 0) top right/26px 26px no-repeat,linear-gradient(#000 0 0) bottom left/26px 26px no-repeat,linear-gradient(#000 0 0) bottom right/26px 26px no-repeat}
.cam .frame svg{position:absolute;inset:12%;width:76%;height:76%;opacity:.55}
.cam .line{position:absolute;left:0;right:0;height:3px;background:#2ee0d4;box-shadow:0 0 14px #2ee0d4;animation:sweep 2.2s ease-in-out infinite alternate}
@keyframes sweep{from{top:6%}to{top:92%}}
.cam .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:13px}
.cam.ok .line{display:none}
.scanok{background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;position:absolute;left:12px;right:12px;bottom:12px;font-size:14px}
.binrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.binrow:hover{border-color:var(--teal)}
.binrow .qr{width:38px;height:38px;border-radius:6px;background:var(--surface2);display:grid;place-items:center;color:var(--ink)}

/* success timeline */
.ok-hero{background:var(--green-soft);color:var(--green-ink);border-radius:14px;text-align:center;padding:22px 16px}
.ok-hero .ck{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin:0 auto 10px}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;padding:6px 0;position:relative;align-items:center}
.tl li::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--line);justify-self:center;z-index:1}
.tl li::after{content:"";position:absolute;left:10px;top:24px;bottom:-8px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.done::before{background:var(--green)} .tl li.now::before{background:var(--amber)}
.tl li.done::after{background:var(--green)}
.tl li.off{color:var(--muted)}

/* map */
.mapbox{background:var(--surface2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .road{fill:var(--surface)} .mapbox .bld{fill:var(--line)} .mapbox text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.pin{cursor:pointer}
.pin circle.c{stroke:#fff;stroke-width:2.5}
.pin.dim{opacity:.18}
.pin.sel circle.ring{display:block}
.pin circle.ring{display:none;fill:none;stroke:var(--ink);stroke-width:2}

/* chart */
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar-n{fill:var(--teal)} .chart .bar-pk{fill:var(--red)}
.rank{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) 28px;gap:10px;align-items:center;font-size:14px;margin-bottom:8px}
.rank .tr{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.rank .tr i{display:block;height:100%;background:var(--teal);border-radius:99px}

/* notifications (LINE-style) */
.msg{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.msg .mh{padding:8px 14px;font-size:13px;font-weight:700;color:#fff;background:var(--line-green)}
.msg.n2 .mh{background:var(--amber);color:#2a1d00} .msg.n3 .mh{background:var(--red)} .msg.n4 .mh,.msg.n5 .mh{background:var(--green)}
.msg .mb{padding:12px 14px;display:grid;gap:8px}
.msg dl{display:grid;grid-template-columns:76px minmax(0,1fr);gap:3px 10px;margin:0;font-size:14px}
.msg dt{color:var(--muted)} .msg dd{margin:0;overflow-wrap:anywhere}
.msg .cond{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.msg .acts{display:flex;gap:8px;flex-wrap:wrap}

/* chat */
.chat{display:grid;grid-template-rows:auto 1fr auto;height:min(70vh,620px);min-height:420px;padding:0;overflow:hidden}
.chat .ch{background:var(--deep);color:var(--deep-ink);padding:12px 16px}
.chat .log{padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:var(--surface2)}
.bub{max-width:86%;padding:10px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface)}
.chat form .input{flex:1}
.qr-row{display:flex;gap:6px;flex-wrap:wrap}
.qr-row button{border:1px solid var(--teal);color:var(--teal-ink);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--deep);color:var(--deep-ink);
  padding:11px 18px;border-radius:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:calc(100% - 32px);font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sdg{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.sdg b{flex:none;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:18px}
.codebox{width:100%;min-height:150px;font-family:var(--mono);font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
@media (prefers-reduced-motion:reduce){.cam .line{animation:none;top:50%}.toast{transition:none}}
</style>
<body>
<header class="bar">
  <div class="wrap">
    <div class="logo"><i aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></i>SMART WASTE</div>
    <div class="sub">ระบบดิจิทัลแจ้งและติดตามปัญหาขยะล้นภายในมหาวิทยาลัย</div>
    <div class="roles" role="group" aria-label="เลือกบทบาทผู้ใช้">
      <button type="button" data-role="reporter" aria-pressed="true">ผู้แจ้ง</button>
      <button type="button" data-role="staff" aria-pressed="false">เจ้าหน้าที่</button>
      <button type="button" data-role="supervisor" aria-pressed="false">ผู้ดูแลพื้นที่</button>
    </div>
    <div class="tools"><button type="button" class="ghost" id="skip" title="ข้ามเวลาไปข้างหน้า 10 นาทีเพื่อทดสอบการแจ้งเตือนและ Escalation">เร่งเวลา +10 นาที</button></div>
  </div>
</header>
<nav class="tabs" aria-label="เมนูหลัก"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body></html>
